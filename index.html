<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ทุเรียนเทพ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E6B34">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ทุเรียนเทพ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html,body{margin:0;height:100%;background:#1E6B34;overflow:hidden}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#1E6B34;color:#fff;font:600 18px sans-serif;transition:opacity .4s}
  #splash img{width:120px;height:120px;border-radius:50%;background:#fff}
  iframe{position:fixed;top:env(safe-area-inset-top);left:0;width:100%;height:calc(100% - env(safe-area-inset-top));border:0;background:#F7F8F5}
</style>
</head>
<body>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbxVWEpJlSDchrRboSfxYyPkGBH8cKSQi5D-uX4bFz9VfCgz04_BtVUioHgCieAWugLTBA/exec" allow="camera; clipboard-write" title="ทุเรียนเทพ"></iframe>
<div id="splash"><img src="icon-192.png" alt=""><div>ทุเรียนเทพ · กำลังเปิด…</div></div>
<script>
  document.getElementById('app').addEventListener('load', () => { const s = document.getElementById('splash'); s.style.opacity = 0; setTimeout(() => s.remove(), 450); });
  setTimeout(() => { const s = document.getElementById('splash'); if (s) { s.style.opacity = 0; setTimeout(() => s.remove(), 450); } }, 8000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
